<app-navbar (cartOpen)="cartOpen.set(true)"></app-navbar>

<main class="app-main">
  @if (store.currentView() === 'customer') {
    <app-product-list></app-product-list>
  } @else {
    <app-owner-dashboard></app-owner-dashboard>
  }
</main>

@if (cartOpen() && store.currentView() === 'customer') {
  <app-cart (close)="cartOpen.set(false)"></app-cart>
}
